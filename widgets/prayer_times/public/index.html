<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <script src="/homey-widget.js" data-origin="widget"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      /* Transparent so Homey renders its own widget background (blur/material) */
      background: transparent;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Root widget card ─────────────────────────────────────────────────── */
    .widget {
      display: flex;
      width: 100%;
      height: 100%;
      background: #0d1b2a;
      border-radius: 16px;
      overflow: hidden;
    }

    /* ── Left panel — next prayer focus ──────────────────────────────────── */
    .panel-left {
      width: 42%;
      min-width: 120px;
      padding: 12px 11px;
      background: rgba(255, 255, 255, .035);
      border-right: 1px solid rgba(255, 255, 255, .07);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .loc-row {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 9px;
      color: rgba(255, 255, 255, .4);
      text-transform: uppercase;
      letter-spacing: .7px;
      line-height: 1;
    }
    .loc-row svg {
      width: 8px; height: 8px;
      stroke: currentColor; fill: none; stroke-width: 2.2;
      flex-shrink: 0;
    }
    .loc-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .next-block { display: flex; flex-direction: column; gap: 1px; }
    .next-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .9px;
      color: #3eb68a;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .next-name {
      font-size: clamp(18px, 5.5vw, 26px);
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -.3px;
    }
    .next-time {
      font-size: clamp(12px, 3.8vw, 16px);
      font-weight: 600;
      color: #3eb68a;
      font-variant-numeric: tabular-nums;
      margin-top: 3px;
    }
    .next-countdown {
      font-size: 10px;
      color: rgba(255, 255, 255, .4);
      margin-top: 5px;
      font-variant-numeric: tabular-nums;
    }

    .hijri-date {
      font-size: 9px;
      color: rgba(255, 255, 255, .28);
      line-height: 1.45;
    }

    /* ── Right panel — daily schedule ────────────────────────────────────── */
    .panel-right {
      flex: 1;
      min-width: 0;
      padding: 8px 9px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .pr-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      border-radius: 7px;
    }
    .pr-row.passed { opacity: .35; }
    .pr-row.next   { background: rgba(62, 182, 138, .13); }

    .pr-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
      background: rgba(255, 255, 255, .2);
    }
    .pr-row.passed .pr-dot { background: rgba(62, 182, 138, .5); }
    .pr-row.next   .pr-dot { background: #3eb68a; }

    .pr-name {
      flex: 1;
      min-width: 0;
      font-size: clamp(10px, 3vw, 12px);
      font-weight: 500;
      color: rgba(255, 255, 255, .72);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pr-row.next .pr-name { color: #3eb68a; }

    .pr-time {
      font-size: clamp(10px, 3vw, 12px);
      font-weight: 500;
      color: rgba(255, 255, 255, .5);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .pr-row.next .pr-time { color: #3eb68a; font-weight: 700; }
  </style>
</head>
<body>

<div class="widget">

  <!-- Left: next prayer focus -->
  <div class="panel-left">
    <div class="loc-row">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span class="loc-text" id="loc-text">—</span>
    </div>

    <div class="next-block">
      <div class="next-label" id="next-label">Next prayer</div>
      <div class="next-name"  id="next-name">—</div>
      <div class="next-time"  id="next-time">—:—</div>
      <div class="next-countdown" id="next-countdown">&nbsp;</div>
    </div>

    <div class="hijri-date" id="hijri-date">—</div>
  </div>

  <!-- Right: full day schedule -->
  <div class="panel-right" id="prayer-list" aria-label="Today's prayer schedule">
    <!-- rows injected by render() -->
  </div>

</div>

<script>
'use strict';

const HIJRI_MONTHS = [
  'Muharram', 'Safar', 'Rabi I', 'Rabi II',
  'Jumada I', 'Jumada II', 'Rajab', "Sha'ban",
  'Ramadan', 'Shawwal', "Dhul Qa'dah", 'Dhul Hijjah',
];

let _data        = null;
let _nextTimeMs  = null;
let _homey       = null;

// ── Entry point ──────────────────────────────────────────────────────────────
function onHomeyReady(Homey) {
  _homey = Homey;

  fetchData();

  // Re-fetch every 60 s (covers prayer time changes, new day, adjustments)
  setInterval(fetchData, 60 * 1000);

  // Countdown ticks every second (client-side, no API call)
  setInterval(tickCountdown, 1000);

  // Widget is shown after first render; Homey.ready() called inside render()
}

// ── Data fetch ───────────────────────────────────────────────────────────────
function fetchData() {
  _homey.api('GET', '/widgetData', null, function(err, data) {
    if (err || !data) return;
    _data = data;
    render(data);
  });
}

// ── Render ───────────────────────────────────────────────────────────────────
function render(data) {
  // Location
  var city = data.city || '';
  var country = data.country || '';
  document.getElementById('loc-text').textContent =
    city ? (city + (country ? ', ' + country : '')) : 'Unknown location';

  // Hijri date
  var h = data.hijriDate || {};
  if (h.day && h.month && h.year) {
    document.getElementById('hijri-date').textContent =
      h.day + ' ' + (HIJRI_MONTHS[h.month - 1] || '') + ' ' + h.year;
  }

  // Next prayer (may come from overrideNext if all today's prayers passed)
  var next = data.overrideNext || (data.prayers && data.prayers.find(function(p) { return p.isNext; }));
  if (next) {
    document.getElementById('next-label').textContent =
      data.overrideNext ? 'Tomorrow' : 'Next prayer';
    document.getElementById('next-name').textContent  = esc(next.name);
    document.getElementById('next-time').textContent  = esc(next.time);
    _nextTimeMs = next.timeMs || null;
    tickCountdown();
  }

  // Prayer list rows
  var list = document.getElementById('prayer-list');
  list.innerHTML = (data.prayers || []).map(function(p) {
    var cls = p.passed ? 'passed' : (p.isNext ? 'next' : '');
    return '<div class="pr-row ' + cls + '" role="listitem">' +
      '<div class="pr-dot"></div>' +
      '<div class="pr-name">' + esc(p.name) + '</div>' +
      '<div class="pr-time">' + esc(p.time) + '</div>' +
    '</div>';
  }).join('');

  _homey.ready();
}

// ── Countdown ─────────────────────────────────────────────────────────────────
function tickCountdown() {
  var el = document.getElementById('next-countdown');
  if (!el || !_nextTimeMs) return;
  var diff = _nextTimeMs - Date.now();
  if (diff <= 0) {
    el.textContent = 'Now';
    return;
  }
  var h = Math.floor(diff / 3600000);
  var m = Math.floor((diff % 3600000) / 60000);
  var s = Math.floor((diff % 60000) / 1000);
  if (h > 0) {
    el.textContent = 'in ' + h + 'h ' + m + 'm';
  } else if (m > 0) {
    el.textContent = 'in ' + m + 'm ' + s + 's';
  } else {
    el.textContent = 'in ' + s + 's';
  }
}

// ── Utility ──────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/[&<>"]/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
</script>
</body>
</html>
