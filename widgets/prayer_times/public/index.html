<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <script src="/homey-widget.js" data-origin="widget"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Theme tokens.
       Colours that must flip with light/dark mode use Homey's semantic
       variables (--homey-background-color, --homey-text-color), which the
       runtime reassigns per theme — no attribute or media query needed.
       Text-hierarchy tiers are produced by per-element `opacity` over the
       theme-correct text colour, so they read correctly in both modes.
       Subtle tints/dividers/dots use a mid-grey alpha overlay, which darkens
       a light card and lightens a dark card without needing theme detection. */
    :root {
      --bg:           var(--homey-background-color, #0d1b2a);
      --text:         var(--homey-text-color, #ffffff);
      --tint:         rgba(128,128,128,.07);
      --divider:      rgba(128,128,128,.16);
      --dot-idle:     rgba(128,128,128,.40);
      --accent:       #2fa877;
      --accent-soft:  rgba(47,168,119,.14);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: transparent;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    /* Full-bleed card — neutralise the default .homey-widget padding. */
    body.homey-widget { padding: 0; }

    /* ── Root widget card ─────────────────────────────────────────────────── */
    .widget {
      display: flex;
      width: 100%;
      height: 100%;
      background: var(--bg);
      border-radius: 16px;
      overflow: hidden;
    }

    /* ── Left panel — next prayer focus ──────────────────────────────────── */
    .panel-left {
      width: 44%;
      min-width: 130px;
      padding: 14px 13px;
      background: var(--tint);
      border-right: 1px solid var(--divider);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .loc-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text);
      opacity: .5;
      text-transform: uppercase;
      letter-spacing: .6px;
      line-height: 1;
    }
    .loc-row svg {
      width: 10px; height: 10px;
      stroke: currentColor; fill: none; stroke-width: 2.2;
      flex-shrink: 0;
    }
    .loc-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .next-block { display: flex; flex-direction: column; gap: 2px; }
    .next-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 2px;
    }
    .next-name {
      font-size: clamp(24px, 7vw, 34px);
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      letter-spacing: -.3px;
    }
    .next-time {
      font-size: clamp(17px, 5vw, 22px);
      font-weight: 600;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      margin-top: 4px;
    }
    .next-countdown {
      font-size: 12px;
      color: var(--text);
      opacity: .45;
      margin-top: 5px;
      font-variant-numeric: tabular-nums;
    }

    .hijri-date {
      font-size: 11px;
      color: var(--text);
      opacity: .4;
      line-height: 1.4;
    }

    /* ── Right panel — daily schedule ────────────────────────────────────── */
    .panel-right {
      flex: 1;
      min-width: 0;
      padding: 10px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .pr-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 7px;
      border-radius: 8px;
    }
    .pr-row.passed { opacity: .38; }
    .pr-row.next   { background: var(--accent-soft); }

    .pr-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--dot-idle);
    }
    .pr-row.passed .pr-dot { background: var(--accent); opacity: .5; }
    .pr-row.next   .pr-dot { background: var(--accent); opacity: 1; }

    .pr-name {
      flex: 1;
      min-width: 0;
      font-size: clamp(13px, 3.8vw, 15px);
      font-weight: 500;
      color: var(--text);
      opacity: .80;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pr-row.next .pr-name { color: var(--accent); opacity: 1; font-weight: 600; }

    .pr-time {
      font-size: clamp(13px, 3.8vw, 15px);
      font-weight: 500;
      color: var(--text);
      opacity: .55;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .pr-row.next .pr-time { color: var(--accent); opacity: 1; font-weight: 700; }
  </style>
</head>
<body class="homey-widget">

<div class="widget">

  <!-- Left: next prayer focus -->
  <div class="panel-left">
    <div class="loc-row">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span class="loc-text" id="loc-text">—</span>
    </div>

    <div class="next-block">
      <div class="next-label" id="next-label">Next prayer</div>
      <div class="next-name"  id="next-name">—</div>
      <div class="next-time"  id="next-time">—:—</div>
      <div class="next-countdown" id="next-countdown">&nbsp;</div>
    </div>

    <div class="hijri-date" id="hijri-date">—</div>
  </div>

  <!-- Right: full day schedule -->
  <div class="panel-right" id="prayer-list" aria-label="Today's prayer schedule">
    <!-- rows injected by render() -->
  </div>

</div>

<script>
'use strict';

const HIJRI_MONTHS = [
  'Muharram', 'Safar', 'Rabi I', 'Rabi II',
  'Jumada I', 'Jumada II', 'Rajab', "Sha'ban",
  'Ramadan', 'Shawwal', "Dhul Qa'dah", 'Dhul Hijjah',
];

let _data        = null;
let _nextTimeMs  = null;
let _homey       = null;

// ── Entry point ──────────────────────────────────────────────────────────────
function onHomeyReady(Homey) {
  _homey = Homey;

  // Signal ready immediately so Homey removes the loading overlay.
  // The widget renders placeholders until the first fetch completes.
  Homey.ready();

  fetchData();

  // Re-fetch every 60 s (covers prayer time changes, new day, adjustments)
  setInterval(fetchData, 60 * 1000);

  // Countdown ticks every second (client-side, no API call)
  setInterval(tickCountdown, 1000);
}

// ── Data fetch ───────────────────────────────────────────────────────────────
async function fetchData() {
  try {
    var data = await _homey.api('GET', '/data');
    if (!data) { console.warn('fetchData: no data returned'); return; }
    _data = data;
    render(data);
  } catch (err) {
    console.error('fetchData error:', err);
  }
}

// ── Render ───────────────────────────────────────────────────────────────────
function render(data) {
  // Location
  var city = data.city || '';
  var country = data.country || '';
  document.getElementById('loc-text').textContent =
    city ? (city + (country ? ', ' + country : '')) : 'Unknown location';

  // Hijri date
  var h = data.hijriDate || {};
  if (h.day && h.month && h.year) {
    document.getElementById('hijri-date').textContent =
      h.day + ' ' + (HIJRI_MONTHS[h.month - 1] || '') + ' ' + h.year;
  }

  // Next prayer (may come from overrideNext if all today's prayers passed)
  var next = data.overrideNext || (data.prayers && data.prayers.find(function(p) { return p.isNext; }));
  if (next) {
    document.getElementById('next-label').textContent =
      data.overrideNext ? 'Tomorrow' : 'Next prayer';
    document.getElementById('next-name').textContent  = esc(next.name);
    document.getElementById('next-time').textContent  = esc(next.time);
    _nextTimeMs = next.timeMs || null;
    tickCountdown();
  }

  // Prayer list rows
  var list = document.getElementById('prayer-list');
  list.innerHTML = (data.prayers || []).map(function(p) {
    var cls = p.passed ? 'passed' : (p.isNext ? 'next' : '');
    return '<div class="pr-row ' + cls + '" role="listitem">' +
      '<div class="pr-dot"></div>' +
      '<div class="pr-name">' + esc(p.name) + '</div>' +
      '<div class="pr-time">' + esc(p.time) + '</div>' +
    '</div>';
  }).join('');

}

// ── Countdown ─────────────────────────────────────────────────────────────────
function tickCountdown() {
  var el = document.getElementById('next-countdown');
  if (!el || !_nextTimeMs) return;
  var diff = _nextTimeMs - Date.now();
  if (diff <= 0) {
    el.textContent = 'Now';
    return;
  }
  var h = Math.floor(diff / 3600000);
  var m = Math.floor((diff % 3600000) / 60000);
  var s = Math.floor((diff % 60000) / 1000);
  if (h > 0) {
    el.textContent = 'in ' + h + 'h ' + m + 'm';
  } else if (m > 0) {
    el.textContent = 'in ' + m + 'm ' + s + 's';
  } else {
    el.textContent = 'in ' + s + 's';
  }
}

// ── Utility ──────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/[&<>"]/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
</script>
</body>
</html>
