name: Publish to Homey App Store

# Manual trigger: pick a version bump and type the changelog users will see.
# (Publishing must be deliberate and needs a changelog, so this is not automatic.)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      changelog:
        description: Changelog (shown to users in the App Store)
        type: string
        required: true

jobs:
  # Run our unit tests on the host runner. Kept separate from publish so the
  # host node_modules (glibc) never leak into the Athom Docker actions (musl) —
  # e.g. the `sharp` native module would otherwise fail to load in-container.
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test

  publish:
    name: Validate, version & publish
    needs: test
    runs-on: ubuntu-latest
    # Needed so the version step can commit the bump, push, and create a release.
    permissions:
      contents: write
    steps:
      # Clean checkout only — the Athom actions install dependencies inside their
      # own container, so we must NOT run `npm install` here.
      - uses: actions/checkout@v4

      - name: Validate app (publish level)
        uses: athombv/github-action-homey-app-validate@master
        with:
          level: publish

      - name: Update version & changelog
        uses: athombv/github-action-homey-app-version@master
        id: version
        with:
          version: ${{ inputs.version }}
          changelog: ${{ inputs.changelog }}

      - name: Commit, tag & push the version bump
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump version to v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD --tags

      - name: Publish to Homey App Store
        uses: athombv/github-action-homey-app-publish@master
        id: publish
        with:
          personal_access_token: ${{ secrets.HOMEY_TOKEN }}

      - name: Summary
        run: |
          echo "✅ Published v${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Submit it for Test/Live at ${{ steps.publish.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
